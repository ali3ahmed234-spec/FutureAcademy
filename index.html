<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بنك الأسئلة الذكي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- أزرار التنقل البسيطة -->
  <nav>
    <button onclick="openTab('student-tab')">تسجيل الطالب</button>
    <button onclick="openTab('bank-tab')">بنك الأسئلة</button>
    <button onclick="window.location.href='admin.html'">صفحة الأدمن (AI)</button>
  </nav>

  <!-- 1. قسم تسجيل الطالب -->
  <div id="student-tab" class="box">
    <h2>تسجيل بيانات الطالب</h2>
    <input type="text" id="st-id" placeholder="الرقم الجامعي (ID)">
    <input type="text" id="st-name" placeholder="اسم الطالب">
    
    <select id="st-year">
      <option value="السنة الأولى">السنة الأولى</option>
      <option value="السنة الثانية">السنة الثانية</option>
      <option value="السنة الثالثة">السنة الثالثة</option>
      <option value="السنة الرابعة">السنة الرابعة</option>
    </select>

    <select id="st-major">
      <option value="علوم الحاسب">علوم الحاسب (CS)</option>
      <option value="نظم المعلومات">نظم المعلومات (IS)</option>
      <option value="تكنولوجيا المعلومات">تكنولوجيا المعلومات (IT)</option>
      <option value="الذكاء الاصطناعي">الذكاء الاصطناعي (AI)</option>
    </select>

    <button onclick="registerStudent()">دخول</button>
  </div>

  <!-- 2. قسم بنك الأسئلة -->
  <div id="bank-tab" class="box" style="display:none;">
    <h2>بنك الأسئلة</h2>
    <p id="welcome-msg"></p>
    <div id="questions-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
