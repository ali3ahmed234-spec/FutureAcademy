<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بنك الأسئلة الذكي - FutureAcademy</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .step-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 400px;
      margin: 20px auto;
    }
    .step-form select,
    .step-form button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      box-sizing: border-box;
    }
    .step-form button {
      background-color: #0284c7;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .step-form button:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>

  <!-- شريط التنقل -->
  <nav>
    <button onclick="openTab('selection-tab')">اختيار المادة</button>
    <button onclick="openTab('bank-tab')">بنك الأسئلة</button>
    <button onclick="window.location.href='admin.html'">صفحة الأدمن (AI)</button>
  </nav>

  <!-- 1. الصفحة الأولى: اختيار السنة -> التخصص -> المادة -> دخول -->
  <div id="selection-tab" class="box">
    <h2>اختر المسار الدراسي</h2>

    <div class="step-form">
      <!-- أولاً: السنة -->
      <select id="st-year" onchange="onYearChange()">
        <option value="" disabled selected>-- اختر السنة الدراسية --</option>
        <option value="السنة الأولى">السنة الأولى</option>
        <option value="السنة الثانية">السنة الثانية</option>
        <option value="السنة الثالثة">السنة الثالثة</option>
        <option value="السنة الرابعة">السنة الرابعة</option>
      </select>

      <!-- ثانياً: التخصص -->
      <select id="st-major" onchange="onMajorChange()" style="display:none;">
        <option value="" disabled selected>-- اختر التخصص --</option>
        <option value="علوم الحاسب">علوم الحاسب</option>
        <option value="نظم المعلومات">نظم المعلومات</option>
        <option value="هندسة البرمجيات">هندسة البرمجيات</option>
        <option value="الذكاء الاصطناعي">الذكاء الاصطناعي</option>
      </select>

      <!-- ثالثاً: المادة -->
      <select id="st-subject" onchange="onSubjectChange()" style="display:none;">
        <option value="" disabled selected>-- اختر المادة --</option>
      </select>

      <!-- رابعاً: زر الدخول -->
      <button type="button" id="enter-bank-btn" onclick="enterQuestionBank()" style="display:none;">
        دخول (Enter)
      </button>
    </div>
  </div>

  <!-- 2. الصفحة الثانية: عرض الأسئلة -->
  <div id="bank-tab" class="box" style="display:none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h2>بنك الأسئلة</h2>
      <button type="button" onclick="openTab('selection-tab')" style="padding: 6px 12px; cursor: pointer;">تغيير المادة</button>
    </div>
    <p id="welcome-msg"></p>
    <div id="questions-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
