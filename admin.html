<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>FutureAcademy - لوحة تحكم الأدمن</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    #uploadForm {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 400px;
      margin: 15px auto;
    }
    #uploadForm input,
    #uploadForm select,
    #uploadForm button {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <nav>
    <button onclick="window.location.href='index.html'">الرجوع لبنك الأسئلة</button>
  </nav>

  <div class="box">
    <h2>لوحة تحكم الأدمن (AI)</h2>
    <p>ارفع صورة امتحان أو ملف PDF لاستخراج الأسئلة وتصنيفها تلقائياً.</p>

    <form id="uploadForm">
      <input type="password" id="adminPassword" placeholder="أدخل كلمة مرور الأدمن" required />

      <select id="examYear" required>
        <option value="" disabled selected>-- اختر السنة الدراسية --</option>
        <option value="السنة الأولى">السنة الأولى</option>
        <option value="السنة الثانية">السنة الثانية</option>
        <option value="السنة الثالثة">السنة الثالثة</option>
        <option value="السنة الرابعة">السنة الرابعة</option>
      </select>

      <select id="examMajor" required>
        <option value="" disabled selected>-- اختر التخصص --</option>
        <option value="علوم الحاسب">علوم الحاسب</option>
        <option value="نظم المعلومات">نظم المعلومات</option>
        <option value="إدارة">إدارة</option>
        <option value="إدارة إنجليزي">إدارة إنجليزي</option>
      </select>

      <input type="file" id="examFile" accept="image/*,.pdf" required />
      <button type="submit" id="submitBtn">تحليل الملف وإضافة الأسئلة</button>
    </form>

    <div id="statusMessage" style="margin-top: 15px;"></div>
    <div id="extractedPreview"></div>
  </div>

  <script>
    const uploadForm = document.getElementById("uploadForm");
    const adminPasswordInput = document.getElementById("adminPassword");
    const examYearSelect = document.getElementById("examYear");
    const examMajorSelect = document.getElementById("examMajor");
    const examFileInput = document.getElementById("examFile");
    const submitBtn = document.getElementById("submitBtn");
    const statusMessage = document.getElementById("statusMessage");
    const extractedPreview = document.getElementById("extractedPreview");

    uploadForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = examFileInput.files[0];
      const password = adminPasswordInput.value;
      const year = examYearSelect.value;
      const major = examMajorSelect.value;
      if (!file || !password || !year || !major) return;

      const formData = new FormData();
      formData.append("password", password);
      formData.append("year", year);
      formData.append("major", major);
      formData.append("examFile", file);

      submitBtn.disabled = true;
      submitBtn.textContent = "جاري التحليل بالذكاء الاصطناعي...";
      statusMessage.innerHTML = "<p>يرجى الانتظار، جاري قراءة الأسئلة...</p>";
      extractedPreview.innerHTML = "";

      try {
        const response = await fetch("http://localhost:3000/api/upload-exam", {
          method: "POST",
          body: formData
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "فشل رفع الملف");
        }

        statusMessage.innerHTML = `<p style="color: #4ade80; font-weight: bold;">${result.message}</p>`;

        extractedPreview.innerHTML = result.questions.map(q => `
          <div class="question-card">
            <strong>${q.major} | ${q.year} | مادة: ${q.subject}</strong>
            <p>${q.question}</p>
          </div>
        `).join("");

        // تفريغ خانة الملف فقط مع الإبقاء على الباسورد والاختيارات لو حبيت ترفع ملف تاني وراه
        examFileInput.value = "";
      } catch (err) {
        statusMessage.innerHTML = `<p style="color: #f87171; font-weight: bold;">خطأ: ${err.message}</p>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "تحليل الملف وإضافة الأسئلة";
      }
    });

    // فحص تلقائي لو السيرفر مش شغال عشان ميجيلكش Failed to fetch فجأة
    fetch("http://localhost:3000/")
      .catch(() => {
        statusMessage.innerHTML = `<p style="color: #fbbf24; font-weight: bold;">⚠️ تنبيه: السيرفر المحلي غير مشغّل حالياً. شغّل أمر node server.js في VS Code.</p>`;
      });
  </script>
</body>
</html>
